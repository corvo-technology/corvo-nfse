# Local test override. Use together with the main Compose file.
name: corvo-nfse-local

services:
  api:
    depends_on:
      localstack:
        condition: service_healthy
      rtc-calculator:
        condition: service_healthy

  worker:
    depends_on:
      localstack:
        condition: service_healthy
      rtc-calculator:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '127.0.0.1:4566:4566'
    volumes:
      - localstackdata:/var/lib/localstack
      - ./scripts/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    networks:
      default:
        aliases: [s3.localhost.localstack.cloud]
    healthcheck:
      test: ['CMD', 'awslocal', 's3api', 'head-bucket', '--bucket', 'corvo-nfse']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  localstackdata:
