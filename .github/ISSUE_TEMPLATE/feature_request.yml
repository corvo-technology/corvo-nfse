name: Feature request
description: An idea to improve Corvo.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. Alternatives you considered are welcome.
  - type: dropdown
    id: scope
    attributes:
      label: Which document is it about?
      description: NFS-e (services) is the production product. NF-e and NFC-e run in test mode. See docs/fiscal/limitations.md.
      options: ["NFS-e (services)", "NF-e or NFC-e (goods, retail)", "Not about a document", "Not sure"]
