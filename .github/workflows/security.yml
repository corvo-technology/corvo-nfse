name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The gitleaks-action needs a paid license for organizations; the open source
      # CLI does the same scan. The release archive is pinned by checksum.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      - name: Scan repository for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --no-banner --verbose --exit-code 1
          else
            gitleaks git --redact --no-banner --verbose --exit-code 1
          fi

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Select Semgrep mode
        id: semgrep-mode
        shell: sh
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            echo "managed=true" >> "$GITHUB_OUTPUT"
          else
            echo "managed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Semgrep managed scan
        if: steps.semgrep-mode.outputs.managed == 'true'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: >-
          semgrep ci
          --audit-on push
          --no-suppress-errors
          --sarif-output semgrep.sarif

      - name: Run Semgrep Community scan for pull request
        if: >-
          steps.semgrep-mode.outputs.managed == 'false' &&
          github.event_name == 'pull_request'
        env:
          SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: >-
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/javascript
          --error
          --strict
          --sarif-output semgrep.sarif
          .

      - name: Run Semgrep Community audit on push
        if: >-
          steps.semgrep-mode.outputs.managed == 'false' &&
          github.event_name == 'push'
        run: >-
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/javascript
          --strict
          --sarif-output semgrep.sarif
          .

      - name: Run Semgrep Community full scan on demand
        if: >-
          steps.semgrep-mode.outputs.managed == 'false' &&
          github.event_name == 'workflow_dispatch'
        run: >-
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/javascript
          --error
          --strict
          --sarif-output semgrep.sarif
          .

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true
