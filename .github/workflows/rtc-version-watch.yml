name: rtc-version-watch
on:
  schedule: [{ cron: '0 12 * * 1' }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare published and pinned versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(sed -n 's/^ARG RTC_TAG=//p' deploy/Dockerfile.rtc | tr -d '[:space:]')"
          published="$(gh api --paginate 'repos/ReceitaFederal/calculadora-rtc-regime-regular/tags' -q '.[].name' | sort -V | tail -n 1 || true)"
          if [ -z "$published" ] || [ -z "$pinned" ]; then
            echo "::warning::Could not read the tags or the pinned version. Nothing was compared."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$pinned" "$published" | sort -V | tail -n 1)" != "$pinned" ]; then
            title="Calculadora RTC: nova versão publicada ($published)"
            if ! gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q .; then
              gh issue create --title "$title" \
                --body "Última tag no GitHub: $published. Tag fixada em deploy/Dockerfile.rtc: $pinned. Seguir docs/fiscal/runbooks/rtc-update.md."
            fi
          fi
