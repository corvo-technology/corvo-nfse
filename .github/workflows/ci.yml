name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every api test runs here: the unit ones and the ones that need a real Postgres
  # (RLS, migrations, repositories, HTTP contract) and Redis. A spec skips itself
  # when its database/Redis variable is missing, so the variables below are what
  # turn them on; the "Nothing was skipped" step fails if one of them goes missing.
  api:
    name: Check api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: corvo
          POSTGRES_PASSWORD: corvo
          POSTGRES_DB: corvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corvo -d corvo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Same pooling mode as the managed database in production. The role is
      # created by rls-pgbouncer.postgres.integration.spec.ts.
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_USER: corvo_pgb_runtime
          DB_PASSWORD: pgb
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 3
          MAX_CLIENT_CONN: 500
        ports:
          - 6432:5432
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: api/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint:check
      - name: Typecheck production code
        run: yarn typecheck
      # The specs create their own schema (owner role) and a restricted runtime
      # role through scripts/provision-runtime-role.sql, so the service's default
      # superuser is enough. Database names must end in _test. Specs that share
      # database state need --runInBand.
      - name: Test (unit, Postgres and Redis)
        env:
          NODE_ENV: test
          MIGRATION_TEST_DATABASE_URL: postgresql://corvo:corvo@localhost:5432/corvo_test
          POSTGRES_POOL_TEST_DATABASE_URL: postgresql://corvo:corvo@localhost:5432/corvo_test
          PGBOUNCER_TEST_URL: postgresql://corvo_pgb_runtime:pgb@localhost:6432/corvo_test
          AUTH_TEST_REDIS_URL: redis://localhost:6379
          RATE_LIMIT_TEST_REDIS_URL: redis://localhost:6379
          REDIS_URL: redis://localhost:6379
        run: yarn test --runInBand --ci --json --outputFile=jest-results.json
      - name: Nothing was skipped
        run: node ../scripts/assert-no-skipped-tests.mjs jest-results.json
      - name: Build
        run: yarn build
      # The public OpenAPI contract is generated from the controllers and
      # committed, so SDK maintainers can read it without running the API.
      - name: OpenAPI contract is up to date
        run: |
          yarn openapi:generate
          if ! git diff --quiet -- ../docs/openapi ../web/public/openapi.json; then
            echo "::error::The public OpenAPI is out of date. Run 'yarn openapi:generate' in api/ and commit docs/openapi and web/public/openapi.json."
            git --no-pager diff --stat -- ../docs/openapi ../web/public/openapi.json
            exit 1
          fi

  web:
    name: Check web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Typecheck production code
        run: yarn typecheck
      - name: Test
        env:
          NODE_ENV: test
        run: yarn test
      - name: Build
        run: yarn build

  # The HTTP end-to-end suites (real app, Postgres, Redis) and the fiscal
  # integration suite, which also needs an S3-compatible store for the documents.
  api-e2e:
    name: E2E api (Postgres, Redis and S3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: corvo
          POSTGRES_PASSWORD: corvo
          POSTGRES_DB: corvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corvo -d corvo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # S3-compatible store for the fiscal documents (credentials test/test).
      s3:
        image: ministackorg/ministack:1.5.44
        env:
          SERVICES: s3
        ports:
          - 4566:4566
    defaults:
      run:
        working-directory: api
    env:
      NODE_ENV: test
      E2E_DATABASE_URL: postgresql://corvo:corvo@localhost:5432/corvo_test
      REDIS_URL: redis://localhost:6379
      E2E_STORAGE_S3_ENDPOINT: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: api/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Wait for S3
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4566/ >/dev/null && exit 0
            sleep 1
          done
          echo "S3 did not come up" >&2
          exit 1
      - name: E2E (HTTP)
        timeout-minutes: 10
        run: yarn test:e2e
      - name: Fiscal integration
        timeout-minutes: 10
        run: yarn test:fiscal:integration

  docker:
    name: Validate Docker and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate local configuration
        run: node scripts/setup-env.mjs
      - name: Validate local Compose
        run: >-
          docker compose --env-file deploy/.env.local
          -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml
          config --quiet
      - name: Validate production Compose structure
        run: >-
          docker compose --env-file deploy/.env
          -f deploy/docker-compose.yml config --quiet
      # The tax calculator image builds with the official Maven image, not the
      # repository's ./mvnw (see deploy/Dockerfile.rtc).
      - name: Build images
        run: >-
          docker compose --env-file deploy/.env.local
          -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml
          build api web rtc-calculator
      - name: Start the tax calculator
        run: |
          docker image ls corvo-rtc:local
          docker compose --env-file deploy/.env.local \
            -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
            up -d --wait --no-deps rtc-calculator
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            "$(docker compose --env-file deploy/.env.local -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml ps -q rtc-calculator)")"
          echo "RTC_URL=http://$ip:8080/api" >> "$GITHUB_ENV"
      - name: Calculator version
        run: curl -fsS "$RTC_URL/calculadora/dados-abertos/versao"
      - name: Calculator smoke test
        if: always()
        run: sh api/scripts/rtc-smoke.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: api/yarn.lock
      - name: Calculator contract tests
        if: always()
        working-directory: api
        env:
          NODE_ENV: test
          RTC_CALCULATOR_URL: ${{ env.RTC_URL }}
        run: |
          yarn install --frozen-lockfile
          yarn jest rtc-integration
      - name: Stop the tax calculator
        if: always()
        run: >-
          docker compose --env-file deploy/.env.local
          -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml
          down -v
