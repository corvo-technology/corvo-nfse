title = "Corvo secret scanning"

[extend]
useDefault = true

# False positives only: placeholders in the documentation examples and fake keys
# in unit-test fixtures (tok_0123456789abcdef, S3CRET-0123456789...). Real credentials are still caught everywhere else.
[allowlist]
description = "Documentation example identifiers and unit-test fixtures"
regexTarget = "line"
regexes = [
  '''(pedido|order)_123_[a-z_]+''',
]
paths = [
  '''api/src/infra/shared/secrets-cipher\.service\.spec\.ts''',
  '''api/src/modules/auth/application/api-key\.service\.spec\.ts''',
  '''api/src/modules/integrations/connectors/woovi/woovi\.connector\.spec\.ts''',
  '''api/src/modules/integrations/connectors/abacatepay/abacatepay\.connector\.spec\.ts''',
  '''api/src/modules/integrations/connectors/stripe/stripe\.(connector|client|flow\.postgres\.integration)\.spec\.ts''',
  '''api/src/modules/integrations/connectors/kiwify/kiwify\.(connector|payload|flow\.postgres\.integration)\.spec\.ts''',
]
